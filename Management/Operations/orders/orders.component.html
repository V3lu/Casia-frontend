<div class="dashboard-shell">
    <p-toolbar class="top-toolbar">
        <ng-template #start>
            <div class="toolbar-brand">
                <div class="toolbar-brand__dot"></div>
                <div>
                    <h2>Orders</h2>
                    <p>Monitor the flow of customer orders and fulfillment.</p>
                </div>
            </div>
        </ng-template>

        <ng-template #center>
            <div class="toolbar-search">
                <i class="pi pi-search"></i>
                <input pInputText placeholder="Search orders" />
            </div>
        </ng-template>

        <ng-template #end>
            <div class="toolbar-actions">
                <p-button icon="pi pi-plus" label="New order" severity="secondary"></p-button>
                <p-button icon="pi pi-bell" [rounded]="true" [text]="true" size="large"></p-button>
                <p-button icon="pi pi-question-circle" [rounded]="true" [text]="true" size="large"></p-button>
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" size="large"></p-avatar>
            </div>
        </ng-template>
    </p-toolbar>

    <div class="module-grid">
        <p-card class="module-card">
            <ng-template #title>Operations overview</ng-template>
            <ng-template #subtitle>Recent fulfillment and order activity summary.</ng-template>
            <div class="module-card__body">
                <div class="summary-stack">
                    <div class="summary-tile">
                        <span>Pending</span>
                        <strong>42</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Shipped</span>
                        <strong>186</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Returns</span>
                        <strong>11</strong>
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</div>
