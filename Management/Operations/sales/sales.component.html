<div class="dashboard-shell">
    <p-toolbar class="top-toolbar">
        <ng-template #start>
            <div class="toolbar-brand">
                <div class="toolbar-brand__dot"></div>
                <div>
                    <h2>Sales</h2>
                    <p>Track storefront performance and sales momentum.</p>
                </div>
            </div>
        </ng-template>

        <ng-template #center>
            <div class="toolbar-search">
                <i class="pi pi-search"></i>
                <input pInputText placeholder="Search sales" />
            </div>
        </ng-template>

        <ng-template #end>
            <div class="toolbar-actions">
                <p-button icon="pi pi-download" label="Report" severity="secondary"></p-button>
                <p-button icon="pi pi-bell" [rounded]="true" [text]="true" size="large"></p-button>
                <p-button icon="pi pi-question-circle" [rounded]="true" [text]="true" size="large"></p-button>
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" size="large"></p-avatar>
            </div>
        </ng-template>
    </p-toolbar>

    <div class="module-grid">
        <p-card class="module-card">
            <ng-template #title>Sales overview</ng-template>
            <ng-template #subtitle>Performance snapshot across all sales channels.</ng-template>
            <div class="module-card__body">
                <div class="summary-stack">
                    <div class="summary-tile">
                        <span>Gross sales</span>
                        <strong>$24.5K</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Orders</span>
                        <strong>320</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Avg. basket</span>
                        <strong>$76.50</strong>
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</div>
