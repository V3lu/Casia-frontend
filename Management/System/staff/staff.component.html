<div class="dashboard-shell">
    <p-toolbar class="top-toolbar">
        <ng-template #start>
            <div class="toolbar-brand">
                <div class="toolbar-brand__dot"></div>
                <div>
                    <h2>Staff</h2>
                    <p>Keep track of team availability and personnel activity.</p>
                </div>
            </div>
        </ng-template>

        <ng-template #center>
            <div class="toolbar-search">
                <i class="pi pi-search"></i>
                <input pInputText placeholder="Search staff" />
            </div>
        </ng-template>

        <ng-template #end>
            <div class="toolbar-actions">
                <p-button icon="pi pi-user-plus" label="Invite" severity="secondary"></p-button>
                <p-button icon="pi pi-bell" [rounded]="true" [text]="true" size="large"></p-button>
                <p-button icon="pi pi-question-circle" [rounded]="true" [text]="true" size="large"></p-button>
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" size="large"></p-avatar>
            </div>
        </ng-template>
    </p-toolbar>

    <div class="module-grid">
        <p-card class="module-card">
            <ng-template #title>Team overview</ng-template>
            <ng-template #subtitle>Current staffing readiness and operational coverage.</ng-template>
            <div class="module-card__body">
                <div class="summary-stack">
                    <div class="summary-tile">
                        <span>Active members</span>
                        <strong>24</strong>
                    </div>
                    <div class="summary-tile">
                        <span>On shift</span>
                        <strong>14</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Open roles</span>
                        <strong>3</strong>
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</div>
