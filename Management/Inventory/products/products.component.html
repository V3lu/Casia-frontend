<div class="dashboard-shell">
    <p-toolbar class="top-toolbar">
        <ng-template #start>
            <div class="toolbar-brand">
                <div class="toolbar-brand__dot"></div>
                <div>
                    <h2>Products</h2>
                    <p>Manage your catalog and product availability.</p>
                </div>
            </div>
        </ng-template>

        <ng-template #center>
            <div class="toolbar-search">
                <i class="pi pi-search"></i>
                <input pInputText placeholder="Search products" />
            </div>
        </ng-template>

        <ng-template #end>
            <div class="toolbar-actions">
                <p-button icon="pi pi-plus" label="Add item" severity="secondary"></p-button>
                <p-button icon="pi pi-bell" [rounded]="true" [text]="true" size="large"></p-button>
                <p-button icon="pi pi-question-circle" [rounded]="true" [text]="true" size="large"></p-button>
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" size="large"></p-avatar>
            </div>
        </ng-template>
    </p-toolbar>

    <div class="module-grid">
        <p-card class="module-card">
            <ng-template #title>Catalog snapshot</ng-template>
            <ng-template #subtitle>Current product performance and health indicators.</ng-template>
            <div class="module-card__body">
                <div class="summary-stack">
                    <div class="summary-tile">
                        <span>Active SKUs</span>
                        <strong>1,245</strong>
                    </div>
                    <div class="summary-tile">
                        <span>New this week</span>
                        <strong>35</strong>
                    </div>
                    <div class="summary-tile">
                        <span>Needs review</span>
                        <strong>18</strong>
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</div>
