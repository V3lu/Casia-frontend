<p-splitter class="mb-8" [panelSizes]="[18, 64, 18]" [layout]="'horizontal'" [gutterSize]="0">
    <ng-template #panel>
        <div class="panel1">
            <div class="mb-4 p-8">
                <p-card class="dashboard-card">
                    <ng-template #title> 
                        <div class="title-text">Dashboard</div>    
                    </ng-template>
                    <ng-template #subtitle> 
                        <div class="subtitle-text">
                            Welcome back, {{ currentUserService.getCurrentUser()?.firstName }}! 👏
                        </div>
                    </ng-template>
                </p-card>
            </div>
        </div>
    </ng-template>
    <ng-template #panel>
        <div class="panel2">
            <div class="card flex flex-wrap justify-center items-end gap-4">
                <p-floatlabel variant="on">
                    <p-iconfield>
                        <p-inputicon class="pi pi-search" />
                        <input pInputText id="on_label" autocomplete="off" pSize="large" [style]="'width: 30rem; border-radius: 1rem;'"/>
                    </p-iconfield>
                    <label for="on_label">Search dashboard</label>
                </p-floatlabel>
            </div>
        </div>
    </ng-template>
    <ng-template #panel>
        <div class="panel3">
            <div class="icons">
                <p-button icon="pi pi-bell" [rounded]="true" [text]="true" size="large"/>
                <p-button icon="pi pi-question-circle" [rounded]="true" [text]="true" size="large"/>
            </div>
            <p-datepicker [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" selectionMode="range" appendTo="body" [style]="'height: 30%;'" [placeholder]="'Filter by date range'"></p-datepicker>
        </div>
    </ng-template>
</p-splitter>

<div class="main-panel">
    <p-splitter class="mb-8" [panelSizes]="[25, 25, 25, 25]" [layout]="'horizontal'" [gutterSize]="0">
        <!-- Card 1 — Total Sales -->
        <ng-template #panel>
            <div class="panel1">
                <div class="flight-card">
                    <div class="flight-card__icon">
                        <i class="pi pi-send"></i>
                    </div>
                    <div class="flight-card__info">
                        <span class="flight-card__label">Total Sales</span>
                        <span class="flight-card__value">$24,530.50</span>
                        <span class="flight-card__change positive">↑ 18.6% vs last week</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'line'"></canvas>
                    </div>
                </div>
            </div>
        </ng-template>
        <!-- Card 2 — Total Orders -->
        <ng-template #panel>
            <div class="panel1">
                <div class="flight-card">
                    <div class="flight-card__icon">
                        <i class="pi pi-clipboard"></i>
                    </div>
                    <div class="flight-card__info">
                        <span class="flight-card__label">Total Orders</span>
                        <span class="flight-card__value">320</span>
                        <span class="flight-card__change positive">↑ 12.4% vs last week</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'line'"></canvas>
                    </div>
                </div>
            </div>
        </ng-template>
        <!-- Card 3 — Total Products -->
        <ng-template #panel>
            <div class="panel1">
                <div class="flight-card">
                    <div class="flight-card__icon">
                        <i class="pi pi-box"></i>
                    </div>
                    <div class="flight-card__info">
                        <span class="flight-card__label">Total Products</span>
                        <span class="flight-card__value">1,245</span>
                        <span class="flight-card__change positive">↑ 8.7% vs last week</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'line'"></canvas>
                    </div>
                </div>
            </div>
        </ng-template>
        <!-- Card 4 — Low Stock Items -->
        <ng-template #panel>
            <div class="panel1">
                <div class="flight-card">
                    <div class="flight-card__icon warning">
                        <i class="pi pi-exclamation-triangle"></i>
                    </div>
                    <div class="flight-card__info">
                        <span class="flight-card__label">Low Stock Items</span>
                        <span class="flight-card__value">23</span>
                        <span class="flight-card__change negative">↓ 6.3% vs last week</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas baseChart [data]="barChartDataNegative" [options]="barChartOptions" [type]="'line'"></canvas>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-splitter>
    <p-splitter class="mb-8" [panelSizes]="[57, 43]" [layout]="'horizontal'" [gutterSize]="0">
        <ng-template #panel>
            <div class="panel4">
                <div class="flight-card">
                    <div class="flight-card__icon">
                        <i class="pi pi-clipboard"></i>
                    </div>
                    <div class="flight-card__info">
                        <span class="flight-card__label">Total Orders</span>
                        <span class="flight-card__value">320</span>
                        <span class="flight-card__change positive">↑ 12.4% vs last week</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas baseChart [data]="barChartData" [options]="barChartOptions" [type]="'line'"></canvas>
                    </div>
                </div>
            </div>
        </ng-template>
        <ng-template #panel>
            <div class="panel5">
                <div class="card flex flex-wrap justify-center items-end gap-4">
                    <p-floatlabel variant="on">
                        <p-iconfield>
                            <p-inputicon class="pi pi-search" />
                            <input pInputText id="on_label" autocomplete="off" pSize="large" [style]="'width: 30rem; border-radius: 1rem;'"/>
                        </p-iconfield>
                        <label for="on_label">Search dashboard</label>
                    </p-floatlabel>
                </div>
            </div>
        </ng-template>
    </p-splitter>
</div>
