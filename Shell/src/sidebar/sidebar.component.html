<p-drawer [(visible)]="visible" position="left" class="app-sidebar-drawer" [showCloseIcon]="false">
    <ng-template #header>
        <div class="sidebar-brand">
            <img src="CASIA_LOGO_VIBRANT.png" alt="Casia" class="sidebar-brand-logo" />
        </div>
    </ng-template>

    <div class="sidebar-shell">
        <nav class="sidebar-nav" aria-label="Sidebar navigation">
            @for (item of visibleNavItems(); track item.route) {
                <a
                    pRipple
                    [routerLink]="item.route"
                    class="sidebar-nav-item"
                    [class.sidebar-nav-item-active]="isActive(item.route)"
                    (click)="visible.set(false)"
                >
                    <i [class]="item.icon"></i>
                    <span>{{ item.label }}</span>
                </a>
            }
        </nav>

        <div class="sidebar-footer">
            <p-divider></p-divider>
            <div class="sidebar-user">
                <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" size="large"></p-avatar>
                <div class="sidebar-user-text">
                    <span class="sidebar-user-name">{{ userFirstName() }} {{ userLastName() }}</span>
                    <span class="sidebar-user-role">{{ userRole() }}</span>
                </div>
            </div>
            <p-button label="Log out" icon="pi pi-sign-out" severity="secondary" [text]="true" (onClick)="logout()"></p-button>
        </div>
    </div>
</p-drawer>

<button
    type="button"
    class="sidebar-enterer"
    [attr.aria-label]="visible() ? 'Close navigation menu' : 'Open navigation menu'"
    [attr.aria-expanded]="visible()"
    (click)="visible.set(!visible())"
>
    <i [class]="visible() ? 'pi pi-angle-left' : 'pi pi-angle-right'"></i>
</button>
