<div class="login-shell">
  <p-card class="login-card">
    <ng-template #header>
      <div class="login-header">
        <div class="login-brand-mark">C</div>
        <div>
          <h1>Casia</h1>
          <p>Sign in to continue</p>
        </div>
      </div>
    </ng-template>

    <form class="login-form" (submit)="$event.preventDefault(); login()">
      <label for="username">Username</label>
      <input id="username" pInputText type="text" autocomplete="username" [value]="username()" (input)="username.set($any($event.target).value)" placeholder="admin" />

      <label for="password">Password</label>
      <input id="password" pInputText type="password" autocomplete="current-password" [value]="password()" (input)="password.set($any($event.target).value)" placeholder="Password" />

      @if (authError()) {
        <p class="login-error">{{ authError() }}</p>
      }

      <p-button label="Sign in" icon="pi pi-sign-in" type="submit" [loading]="isSubmitting()" [disabled]="isSubmitting()" styleClass="login-submit"></p-button>
    </form>
  </p-card>
</div>
